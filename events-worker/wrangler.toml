# alberta-snow-events: TEST snow-event recorder for https://krepchin.github.io/alberta-snow-radar/
# Separate from alberta-plow-relay (reads its public data through a read-only service binding).
name = "alberta-snow-events"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
# Kill switch: "false" stops all logging (cron does nothing) and hides the Events link on the map page.
EVENTS_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "alberta-snow-events"
database_id = "f672b088-10c4-4bc6-9fdc-8fdab5242691"

[[services]]
binding = "RELAY"
service = "alberta-plow-relay"

[observability]
enabled = false
