<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05080f" />
<link rel="icon" href="data:," /><!-- no favicon: stops Chrome requesting /favicon.ico (404 console error) -->
<title>Admin — Logins · Alberta Snow Radar</title>
<script>document.documentElement.className += ' js';</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Non-blocking web font: the page renders with system fonts if Google Fonts is slow or blocked -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
<style>
  :root {
    --bg: #05080f;
    --bg2: #0a111d;
    --glass: rgba(10, 18, 32, 0.66);
    --glass-strong: rgba(8, 14, 26, 0.86);
    --line: rgba(20, 224, 192, 0.16);
    --line-strong: rgba(20, 224, 192, 0.38);
    --text: #e6f1ff;
    --muted: #7f93ad;
    --dim: #4d5f78;
    --cyan: #19d3c5;
    --teal: #14e0c0;
    --glow: 0 0 0 1px rgba(20, 224, 192, 0.55), 0 0 18px rgba(25, 211, 197, 0.35);
    --amber: #fbbf24;
    --red: #f87171;
    --snowc: #c7d2fe;
    --cold: #7dd3fc;
    --radius: 14px;
    --font: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    font-family: var(--font); color: var(--text);
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(20,224,192,0.07), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(25,211,197,0.05), transparent 60%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--cyan); }

  .nojs {
    margin: 12px; padding: 0.9rem 1rem; border-radius: 12px;
    background: #2a1a08; border: 1px solid var(--amber); color: #fde68a; font-size: 0.9rem; line-height: 1.45;
  }
  .nojs strong { color: #fff; }
  .js .nojs { display: none; }

  /* ---------- Header ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45); }
  .hdr {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    padding: 0.55rem 1rem; padding-top: calc(0.55rem + env(safe-area-inset-top));
    padding-left: calc(1rem + env(safe-area-inset-left)); padding-right: calc(1rem + env(safe-area-inset-right));
    background: linear-gradient(180deg, rgba(10, 17, 29, 0.98), rgba(6, 10, 18, 0.96));
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
  .brand > div { min-width: 0; }
  .scope {
    position: relative; flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line-strong);
    background:
      radial-gradient(circle, transparent 38%, rgba(20,224,192,0.18) 39%, transparent 41%),
      radial-gradient(circle, transparent 68%, rgba(20,224,192,0.18) 69%, transparent 71%),
      radial-gradient(circle at center, #0b1a24, #05080f 70%);
    box-shadow: 0 0 14px rgba(25, 211, 197, 0.25), inset 0 0 10px rgba(25, 211, 197, 0.15);
    overflow: hidden;
  }
  .scope::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(20,224,192,0.55), rgba(20,224,192,0) 70deg, transparent 360deg);
    animation: sweep 3.6s linear infinite;
  }
  .scope::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
    border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px var(--teal);
  }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .title-row { display: flex; align-items: center; gap: 0.45rem; min-width: 0; }
  .brand h1 { margin: 0; min-width: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ver { flex: 0 0 auto; font: 600 0.6rem/1 var(--mono); letter-spacing: 0.06em; color: var(--teal); padding: 0.18rem 0.32rem;
    border: 1px solid rgba(20, 224, 192, 0.45); border-radius: 5px; background: rgba(20, 224, 192, 0.08); box-shadow: 0 0 8px rgba(20, 224, 192, 0.18); }
  .brand .sub { margin: 0.05rem 0 0; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 0.4rem; min-height: 44px; padding: 0 0.85rem;
    border-radius: 12px; border: 1px solid rgba(20, 224, 192, 0.5); background: rgba(20, 224, 192, 0.08);
    color: #e9fffb; text-decoration: none; font-weight: 600; font-size: 0.9rem; box-shadow: 0 0 14px rgba(20,224,192,0.15);
    touch-action: manipulation; transition: background .2s var(--ease), box-shadow .2s var(--ease);
  }
  .back:hover { background: rgba(20, 224, 192, 0.16); box-shadow: var(--glow); }
  .back:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--cyan); }
  .back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  main { max-width: 480px; margin: 0 auto; padding: 1.1rem 1rem calc(1.5rem + env(safe-area-inset-bottom)); }
  .h2 { display:flex; align-items:center; gap:.5rem; margin:.4rem 0 .35rem; font-size:1.5rem; font-weight:600; }
  .h2::before { content:''; width:14px; height:2px; background:var(--teal); box-shadow:0 0 6px var(--teal); border-radius:2px; }
  .lead { margin:0 0 1rem; color:var(--muted); font-size:.92rem; line-height:1.45; }
  .k { display:block; font:600 .62rem/1.3 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 .45rem; }
  .choices { display:grid; gap:10px; margin-bottom:1.1rem; }
  .choice { display:flex; align-items:center; gap:.8rem; width:100%; min-height:68px; padding:.8rem .95rem; border-radius:var(--radius);
    background:var(--glass); border:1px solid var(--line); color:var(--text); font:600 1.02rem/1.2 var(--font); text-align:left; cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03); touch-action:manipulation; }
  .choice .ic { flex:0 0 auto; width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font:700 .72rem/1 var(--mono);
    border:1px solid var(--line-strong); background:rgba(20,224,192,.08); color:var(--teal); }
  .choice.emcon .ic { color:#ffb366; border-color:rgba(255,138,31,.5); background:rgba(255,138,31,.08); }
  .choice small { display:block; margin-top:.2rem; font:500 .66rem/1.3 var(--mono); color:var(--muted); }
  .choice .rad { margin-left:auto; width:22px; height:22px; border-radius:50%; border:2px solid var(--dim); flex:0 0 auto; }
  .choice[aria-pressed="true"] { border-color:rgba(20,224,192,.6); box-shadow:0 0 0 1px rgba(20,224,192,.25), 0 0 22px rgba(20,224,192,.15); }
  .choice[aria-pressed="true"] .rad { border-color:var(--teal); background:radial-gradient(circle, var(--teal) 42%, transparent 46%); box-shadow:0 0 8px rgba(20,224,192,.5); }
  .panel { padding:.9rem; border-radius:var(--radius); background:var(--glass); border:1px solid var(--line); }
  .field { margin-bottom:.8rem; }
  .field input { width:100%; min-height:48px; padding:0 .85rem; border-radius:12px; border:1px solid var(--line-strong); background:rgba(3,10,18,.7);
    color:var(--text); font:500 1rem var(--font); }
  .field input::placeholder { color:var(--dim); }
  .go { width:100%; min-height:50px; border-radius:12px; border:1px solid rgba(20,224,192,.7); background:linear-gradient(180deg,#19d3c5,#12b8a6);
    color:#041b17; font:700 .82rem/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; box-shadow:0 0 18px rgba(25,211,197,.3); }
  .req { margin:1rem 0 0; text-align:center; font-size:.92rem; }
  .req a { font-weight:600; text-decoration:none; }
  .req p { margin:.35rem 0 0; font:500 .68rem/1.45 var(--mono); color:var(--muted); }
  .foot { margin:1.4rem 0 0; font-size:.7rem; color:var(--dim); text-align:center; }
  @media (max-width: 440px) { .hdr{padding-left:.75rem;padding-right:.75rem;gap:.5rem} .brand{gap:.5rem} .scope{width:30px;height:30px} .brand h1{font-size:.95rem} .brand .sub{display:none} .back{padding:0 .7rem;font-size:.85rem} }
  .st{margin:0 0 .75rem;font-size:1.1rem;font-weight:600;color:var(--teal)} .emc .st{color:#ffb366}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.65rem 0;border-top:1px dashed rgba(20,224,192,.12)}
  .row:first-of-type{border-top:0}
  .who{flex:1 1 60%;min-width:0} .who b{display:block;font-size:.98rem} .who span{font:500 .66rem/1.4 var(--mono);color:var(--muted)}
  .g{font:700 .58rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:.28rem .4rem;border-radius:6px;border:1px solid var(--line-strong);color:var(--teal)}
  .g.e{color:#ffb366;border-color:rgba(255,138,31,.5)}
  .btns{display:flex;gap:6px;width:100%}
  .b{flex:1;min-height:42px;border-radius:10px;font:600 .7rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(20,224,192,.5);background:rgba(20,224,192,.1);color:#e9fffb}
  .b.no{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.08);color:#fecaca}
  .b.gh{border-color:var(--line);background:rgba(3,7,14,.6);color:var(--muted)}
  .exm{display:inline-block;margin-left:.5rem;font:700 .56rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:.3rem .42rem;border-radius:6px;color:#1f1405;background:var(--amber);vertical-align:middle}
  .seg2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:.8rem}
  .seg2 label{min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:.85rem;text-align:center}
  .seg2 .on{border-color:rgba(20,224,192,.6);background:rgba(20,224,192,.1);box-shadow:0 0 14px rgba(20,224,192,.15)}

  .msg{margin:.6rem 0 0;font:500 .72rem/1.45 var(--mono);color:var(--muted)} .msg.err{color:var(--red)} .msg.ok{color:var(--teal)}
  .seg2 label{cursor:pointer} .seg2 input{position:absolute;opacity:0;pointer-events:none}
  .empty{margin:.2rem 0;font:500 .72rem/1.45 var(--mono);color:var(--muted)}
  .row .ap{display:none;width:100%} .row.open .ap{display:block} .row .ap .field{margin:.5rem 0}
  .rv{opacity:.55}
</style>
<script src="auth.js"></script>
</head>
<body>
<div class="topbar"><header class="hdr">
  <div class="brand"><div class="scope" aria-hidden="true"></div>
    <div><div class="title-row"><h1>Alberta Snow Radar</h1><span class="ver">v5.9</span></div><p class="sub">Weather · 511 roads · plow deployments</p></div></div>
  <a class="back" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Radar</a>
</header></div>
<main>
  <h2 class="h2">Admin — Logins</h2>
  <form class="panel" id="pwForm" style="margin-bottom:12px">
    <h3 class="st">Admin password</h3>
    <div class="field"><label class="k" for="ap">Password</label><input id="ap" type="password" placeholder="••••••••" autocomplete="current-password" required></div>
    <button class="go" type="submit">Open admin</button><p class="msg" role="status"></p>
  </form>
  <div id="adm" hidden>
  <p class="lead">Approve or deny requests, add accounts, and manage access.</p>
  <section class="panel" style="margin-bottom:12px"><h3 class="st">Access requests</h3><div id="reqs"></div></section>
  <form class="panel" id="addForm" style="margin-bottom:12px"><h3 class="st">Add account</h3>
    <span class="k">Group</span><div class="seg2"><label class="on"><input type="radio" name="g" value="gov" checked>Alberta Government</label><label><input type="radio" name="g" value="emcon">Emcon Services</label><label><input type="radio" name="g" value="both">Both</label></div>
    <div class="field"><label class="k" for="nu">Username</label><input id="nu" placeholder="Username" autocapitalize="none" autocorrect="off" autocomplete="off" required></div>
    <div class="field"><label class="k" for="np">Password</label><input id="np" type="password" placeholder="••••••••" autocomplete="new-password" required minlength="8"></div>
    <button class="go" type="submit">Create account</button><p class="msg" role="status"></p></form>
  <section class="panel" style="margin-bottom:12px"><h3 class="st">Current accounts</h3><div id="users"></div></section>
  <section class="panel"><h3 class="st">Login activity</h3><div id="acts"></div></section>
  </div>
  <p class="foot">albertaweatherradar.ca</p>
</main>
<script>
(function(){
  var A=ASRAuth, K='asr_admin';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function pw(){ try{return sessionStorage.getItem(K)||''}catch(e){return ''} }
  function call(path,body){ return fetch(A.API+path,{method:body?'POST':'GET',headers:Object.assign({Authorization:'Bearer '+pw()},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){ if(!r.ok){ if(r.status===401){try{sessionStorage.removeItem(K)}catch(e){} } throw new Error(j.error||('HTTP '+r.status)); } return j; })}); }
  var GN={gov:'Alberta Government',emcon:'Emcon Services',both:'Both'};
  function tag(g){ return '<span class="g'+(g==='emcon'?' e':'')+'">'+GN[g]+'</span>'; }
  function day(t){ return new Date(t).toLocaleDateString('en-CA',{timeZone:'America/Edmonton',month:'short',day:'numeric',year:'numeric'}); }
  var f=document.getElementById('pwForm');
  function open(){ var msg=f.querySelector('.msg'); msg.className='msg'; msg.textContent='Checking…';
    call('/admin/check').then(function(){ f.hidden=true; adm.hidden=false; refresh(); }, function(e){ msg.className='msg err'; msg.textContent=e.message; }); }
  f.onsubmit=function(e){ e.preventDefault(); try{sessionStorage.setItem(K,ap.value)}catch(x){} open(); };
  if(pw()) open();
  function refresh(){
    call('/admin/requests').then(function(j){ var p=j.requests.filter(function(r){return r.status==='pending'});
      reqs.innerHTML=p.length?p.map(function(r){ return '<div class="row" data-id="'+r.id+'" data-g="'+r.group+'"><div class="who"><b>'+esc(r.name)+'</b><span>Requested '+day(r.created)+' · '+esc(r.contact)+(r.note?' · '+esc(r.note):'')+'</span></div>'+tag(r.group)+
        '<div class="btns"><button class="b" data-a="approve">Approve</button><button class="b no" data-a="deny">Deny</button></div>'+
        '<div class="ap"><div class="field"><label class="k">Username</label><input class="au" autocapitalize="none" autocorrect="off" autocomplete="off"></div><div class="field"><label class="k">Password</label><input class="apw" type="password" autocomplete="new-password"></div><button class="b" data-a="confirm" style="width:100%">Create account and approve</button><p class="msg"></p></div></div>'; }).join(''):'<p class="empty">No pending requests.</p>';
    }, function(e){ reqs.innerHTML='<p class="empty">'+esc(e.message)+'</p>'; });
    call('/admin/users').then(function(j){
      users.innerHTML=j.users.length?j.users.map(function(u){ return '<div class="row'+(u.status==='revoked'?' rv':'')+'" data-id="'+u.id+'"><div class="who"><b>'+esc(u.username)+'</b><span>'+(u.status==='revoked'?'Revoked':'Active')+' · added '+day(u.created)+'</span></div>'+tag(u.group)+
        '<div class="btns"><button class="b gh" data-a="reset">Reset password</button>'+(u.status==='revoked'?'<button class="b" data-a="restore">Restore</button>':'<button class="b no" data-a="revoke">Revoke</button>')+'</div></div>'; }).join(''):'<p class="empty">No accounts yet.</p>';
    }, function(e){ users.innerHTML='<p class="empty">'+esc(e.message)+'</p>'; });
    call('/admin/logins?days=30').then(function(j){ var L=j.logins, V=j.visits;
      var TF=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Edmonton',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
      acts.innerHTML='<p class="empty">Successful logins: '+L.today+' today / '+L.d7+' 7 days / '+L.all+' all time</p>'+
        '<p class="empty">Main page visits: '+V.today+' today / '+V.d7+' 7 days / '+V.all+' all time ('+V.unique_today+' unique today)</p>'+
        (j.events.length?j.events.map(function(e){ return '<div class="row"><div class="who"><b>'+esc(e.username||'—')+'</b><span>'+TF.format(new Date(e.ts))+' MT · '+(e.success?'Success':'Failed')+(e.ua?' · '+esc(e.ua):'')+'</span></div>'+(e.group?tag(e.group):'')+'</div>'; }).join(''):'<p class="empty">No sign-in attempts in the last 30 days.</p>');
    }, function(e){ acts.innerHTML='<p class="empty">'+esc(e.message)+'</p>'; });
  }
  reqs.onclick=function(e){ var b=e.target.closest('button'); if(!b) return; var row=b.closest('.row'), id=row.dataset.id, msg=row.querySelector('.ap .msg');
    if(b.dataset.a==='approve'){ row.classList.toggle('open'); return; }
    if(b.dataset.a==='deny'){ if(!confirm('Deny this request?')) return; call('/admin/requests/'+id+'/deny',{}).then(refresh,function(x){alert(x.message)}); return; }
    if(b.dataset.a==='confirm') call('/admin/requests/'+id+'/approve',{username:row.querySelector('.au').value.trim(),password:row.querySelector('.apw').value,group:row.dataset.g})
      .then(refresh,function(x){ msg.className='msg err'; msg.textContent=x.message; });
  };
  users.onclick=function(e){ var b=e.target.closest('button'); if(!b) return; var id=b.closest('.row').dataset.id;
    if(b.dataset.a==='reset'){ var p=prompt('New password (at least 8 characters):'); if(!p) return; call('/admin/users/'+id+'/reset',{password:p}).then(function(){alert('Password changed. That user is signed out everywhere.');refresh()},function(x){alert(x.message)}); }
    else if(b.dataset.a==='revoke'){ if(confirm('Revoke this account? They are signed out right away.')) call('/admin/users/'+id+'/revoke',{}).then(refresh,function(x){alert(x.message)}); }
    else if(b.dataset.a==='restore'){ call('/admin/users/'+id+'/restore',{}).then(refresh,function(x){alert(x.message)}); }
  };
  var af=document.getElementById('addForm');
  af.querySelectorAll('.seg2 input').forEach(function(i){ i.onchange=function(){ af.querySelectorAll('.seg2 label').forEach(function(l){ l.classList.toggle('on',l.querySelector('input').checked); }); }; });
  af.onsubmit=function(e){ e.preventDefault(); var msg=af.querySelector('.msg');
    call('/admin/users',{group:af.g.value,username:nu.value.trim(),password:np.value}).then(function(){ msg.className='msg ok'; msg.textContent='Account created.'; nu.value=''; np.value=''; refresh(); },function(x){ msg.className='msg err'; msg.textContent=x.message; }); };
})();
</script>
</body></html>
